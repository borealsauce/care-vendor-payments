<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>Care Vendor Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--line:#262626;--gold:#e8b923;--txt:#f5f5f5;--muted:#a3a3a3;--red:#ff5a63;--amber:#f59e0b;--gb:#e8b92347}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#e8b9231a,transparent),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}
h1,h2{font-family:Oswald,sans-serif;margin:0;color:var(--gold);text-transform:uppercase}h1{letter-spacing:.08em;font-size:26px}
h2{font-size:18px;margin:28px 0 10px;letter-spacing:.1em;font-weight:600;border-left:3px solid var(--gold);padding-left:10px}
.top{background:linear-gradient(180deg,#0c0c0c,#050505);border-bottom:1px solid var(--gb);padding:18px 0;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#e8b923,transparent)}
.w{max-width:1500px;margin:0 auto;padding:0 16px}.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.card{background:linear-gradient(180deg,#1c1c1c,#141414);border:1px solid var(--gb);border-radius:1rem;padding:14px}
.card.warn{border-color:#f59e0b66;background:linear-gradient(180deg,#2a1f0a,#1a1408)}
.card .l{font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.card .v{font:700 26px Oswald;color:var(--gold);margin:4px 0}.card.warn .v{color:var(--amber)}.card .s{font-size:12px;color:var(--muted)}
.tw{overflow:auto;max-height:80vh;border-radius:1rem;border:1px solid var(--gb)}
table{width:100%;border-collapse:collapse;background:#141414;color:var(--txt)}
th,td{padding:9px 10px;text-align:left;vertical-align:top}
th{background:#0c0c0c;color:var(--gold);text-transform:uppercase;font:600 11px Inter;letter-spacing:.1em;border-bottom:1px solid var(--gold);position:sticky;top:0;z-index:2;white-space:nowrap}
td{border-bottom:1px solid #202020;font-size:13px;min-width:90px}
td.sc{font-weight:700;color:#fff;min-width:170px;position:sticky;left:0;background:#111;z-index:1}
tr:nth-child(even) td{background:#0c0c0c66}tr:hover td{background:#e8b92314}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font:700 11px Inter;white-space:nowrap}
.y{background:#22c55e26;color:#4ade80;border:1px solid #22c55e66}.n{background:#f59e0b26;color:#fbbf24;border:1px solid #f59e0b66}
.dup{color:var(--gold);font-size:11px}
.editbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}
.editbar button,.btn{font:700 13px Inter;padding:9px 16px;border:0;border-radius:999px;background:var(--gold);color:#050505;cursor:pointer}
.editbar button.ghost,.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gb)}
.editbar .hint{color:var(--muted);font-size:12px}
#addForm{display:none;margin:8px 0 16px;padding:14px;border:1px solid var(--gb);border-radius:1rem;background:linear-gradient(180deg,#1c1c1c,#141414)}
#addForm.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.fg label{display:flex;flex-direction:column;gap:6px;font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fg input,.fg select{font:15px Inter;padding:9px 10px;border:1px solid var(--gb);border-radius:8px;background:#0c0c0c;color:var(--txt)}
.fa{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.tiny{font:700 11px Inter;padding:4px 10px;border-radius:999px;border:1px solid var(--gb);background:transparent;color:var(--gold);cursor:pointer}
button.tiny.del{color:#ff7b82;border-color:#ff2d3a55}
footer{margin:30px 0;color:var(--muted);font-size:12px}
@media(max-width:640px){h1{font-size:20px}.card .v{font-size:22px}td.sc{min-width:120px}}
</style></head><body>
<div class="top"><div class="w"><h1>Care Vendor Payments</h1><div class="muted" style="margin-top:6px">Lifeworx, Firstlight &amp; Brightstar payments and self-reimbursement status · tap any header to sort</div></div></div>
<div class="w">
<div class="cards" id="cards"></div>
<div class="editbar">
  <button type="button" id="btnAdd" onclick="toggleAdd()">+ Add line</button>
  <button type="button" class="ghost" onclick="resetLocal()">Reset local edits</button>
  <span class="hint" id="editHint">Edits save in this browser · server Yes beats a local No</span>
</div>
<div id="addForm">
  <div class="fg">
    <label>Vendor
      <select id="fVendor">
        <option>Firstlight</option>
        <option>Lifeworx</option>
        <option>Brightstar</option>
        <option>HomeRN</option>
        <option>Other</option>
      </select>
    </label>
    <label>Date
      <input type="date" id="fDate">
    </label>
    <label>Amount
      <input type="number" id="fAmount" min="0" step="0.01" placeholder="0.00">
    </label>
    <label>Reimbursed
      <select id="fReimb">
        <option value="No" selected>No</option>
        <option value="Yes">Yes</option>
      </select>
    </label>
  </div>
  <div class="fa">
    <button type="button" class="btn" onclick="saveAdd()">Save line</button>
    <button type="button" class="btn ghost" onclick="toggleAdd(false)">Cancel</button>
  </div>
</div>
<h2>By Vendor</h2><div class="tw"><table id="vt"></table></div>
<h2>All Payments</h2><div class="tw"><table id="pt"></table></div>
<footer class="muted" style="margin:24px 0">Built from Care Vendor Payments.numbers · local edits in this browser</footer>
</div>
<script>
const LS='care_vendor_payments_edits_v1';
const $=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>{const[y,m,d]=s.split('-');return `${+m}/${+d}/${y}`};
const today=()=>{const t=new Date();const z=n=>String(n).padStart(2,'0');return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}`};
const isYes=r=>/yes/i.test(String(r||''));

function loadEdits(){
  try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return{}}
}
function saveEdits(e){
  localStorage.setItem(LS,JSON.stringify(e));
  document.getElementById('editHint').textContent='Saved locally · '+new Date().toLocaleString();
}
function resetLocal(){
  if(!confirm('Clear all lines and reimbursed flips saved in this browser?'))return;
  localStorage.removeItem(LS);location.reload();
}
function toggleAdd(force){
  const el=document.getElementById('addForm');
  const open=force===false?false:force===true?true:!el.classList.contains('open');
  el.classList.toggle('open',open);
  if(open){
    document.getElementById('fDate').value=today();
    document.getElementById('fAmount').value='';
    document.getElementById('fReimb').value='No';
    document.getElementById('fAmount').focus();
  }
}
function saveAdd(){
  const v=document.getElementById('fVendor').value;
  const d=document.getElementById('fDate').value;
  const a=parseFloat(document.getElementById('fAmount').value);
  const r=document.getElementById('fReimb').value;
  if(!d||!isFinite(a)||a<=0){alert('Enter a date and a positive amount.');return;}
  const e=loadEdits();
  e.adds=e.adds||[];
  e.adds.push({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),v,a:Math.round(a*100)/100,d,r,local:true});
  saveEdits(e);toggleAdd(false);render();
}
function setReimb(id,serverR,val){
  const e=loadEdits();
  e.reimb=e.reimb||{};
  // server Yes wins over local No
  if(isYes(serverR)&&val==='No'){
    delete e.reimb[id];
    saveEdits(e);render();
    alert('Server already has this as reimbursed Yes — that wins over a local No.');
    return;
  }
  e.reimb[id]=val;
  saveEdits(e);render();
}
function delLocal(id){
  const e=loadEdits();
  e.adds=(e.adds||[]).filter(x=>x.id!==id);
  if(e.reimb)delete e.reimb[id];
  saveEdits(e);render();
}

let BASE=null;
function mergeRows(){
  const e=loadEdits();
  const rows=(BASE.rows||[]).map(r=>({...r,local:false,serverR:r.r}));
  for(const a of (e.adds||[])){
    rows.push({...a,local:true,serverR:a.r,src:a.src||'local'});
  }
  for(const r of rows){
    const flip=(e.reimb||{})[r.id];
    if(flip){
      if(isYes(r.serverR)&&flip==='No'){
        r.r='Yes'; // server Yes wins
      }else{
        r.r=flip;
      }
    }
  }
  return rows;
}
function render(){
  const R=mergeRows();
  const tot=R.reduce((s,r)=>s+r.a,0);
  const re=R.filter(r=>isYes(r.r)).reduce((s,r)=>s+r.a,0);
  const unre=R.filter(r=>!isYes(r.r));
  const unreTot=unre.reduce((s,r)=>s+r.a,0);
  const V=[...new Set(R.map(r=>r.v))].map(v=>{
    const x=R.filter(r=>r.v===v);
    return{v,n:x.length,a:x.reduce((s,r)=>s+r.a,0),f:x.map(r=>r.d).sort()[0],l:x.map(r=>r.d).sort().at(-1)};
  }).sort((a,b)=>b.a-a.a);
  const key=r=>r.v+'|'+r.a+'|'+r.d,cnt={};R.forEach(r=>cnt[key(r)]=(cnt[key(r)]||0)+1);
  const last=[...R].sort((a,b)=>b.d.localeCompare(a.d)||b.a-a.a)[0];
  const C=(l,v,s,cls='')=>`<div class="card ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  document.getElementById('cards').innerHTML=[
    C('Total paid',$(tot),`${R.length} payments · ${V.length} vendors`),
    ...V.map(x=>C(x.v,$(x.a),`${x.n} payments · ${(tot?x.a/tot*100:0).toFixed(1)}%`)),
    C('Self-reimbursed',$(re),`${R.filter(r=>isYes(r.r)).length} of ${R.length} payments`),
    C('Not reimbursed',$(unreTot),`${unre.length} payment${unre.length===1?'':'s'} still open`,'warn'),
    last?C('Latest payment',$(last.a),`${last.v} · ${fd(last.d)}`):''
  ].join('');
  document.getElementById('vt').innerHTML='<thead><tr><th>Vendor</th><th>Payments</th><th>Total</th><th>% of total</th><th>Average</th><th>First</th><th>Latest</th></tr></thead><tbody>'+
    V.map(x=>`<tr><td class="sc">${x.v}</td><td data-v="${x.n}">${x.n}</td><td data-v="${x.a}">${$(x.a)}</td><td data-v="${tot?x.a/tot:0}">${(tot?x.a/tot*100:0).toFixed(1)}%</td><td data-v="${x.a/x.n}">${$(x.a/x.n)}</td><td data-v="${x.f}">${fd(x.f)}</td><td data-v="${x.l}">${fd(x.l)}</td></tr>`).join('')+
    `<tr><td class="sc">Total</td><td data-v="${R.length}">${R.length}</td><td data-v="${tot}">${$(tot)}</td><td data-v="1">100%</td><td data-v="${R.length?tot/R.length:0}">${R.length?$(tot/R.length):'$0.00'}</td><td></td><td></td></tr></tbody>`;
  document.getElementById('pt').innerHTML='<thead><tr><th>Date</th><th>Vendor</th><th>Amount</th><th>Self-reimbursed</th><th></th></tr></thead><tbody>'+
    [...R].sort((a,b)=>b.d.localeCompare(a.d)||b.a-a.a).map(r=>{
      const yes=isYes(r.r);
      const next=yes?'No':'Yes';
      const actions=`<button type="button" class="tiny" onclick="setReimb('${r.id}','${r.serverR||r.r}','${next}')">Mark ${next}</button>`+
        (r.local?` <button type="button" class="tiny del" onclick="delLocal('${r.id}')">Delete</button>`:'');
      return `<tr><td data-v="${r.d}">${fd(r.d)}${cnt[key(r)]>1?' <span class="dup">⚠ same amount &amp; date twice</span>':''}</td><td>${r.v}</td><td data-v="${r.a}">${$(r.a)}</td><td><span class="tag ${yes?'y':'n'}">${r.r||'No'}</span></td><td>${actions}</td></tr>`;
    }).join('')+'</tbody>';
  if(window.initSortableTables)window.initSortableTables();
}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{BASE=D;document.getElementById('fDate').value=today();render();});
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();
/* Drag-and-drop column reorder (all tracker tables). Drag a header onto another to move the column.
   Order persists per page + table header set in localStorage. Skips tables with colspan headers or data-noreorder. */
(function(){
  if(window.__colReorder)return;window.__colReorder=1;
  var st=document.createElement('style');
  st.textContent='th.cr-over{box-shadow:inset 3px 0 0 #d4a017}th[draggable=true]{-webkit-user-drag:element}';
  (document.head||document.documentElement).appendChild(st);
  function lab(th){var c=th.cloneNode(true);c.querySelectorAll('.srt-ar,.rz').forEach(function(x){x.remove()});return c.textContent.trim();}
  function hrow(tb){var r=tb.tHead&&tb.tHead.rows.length?tb.tHead.rows[tb.tHead.rows.length-1]:tb.rows[0];return r&&r.querySelector('th')?r:null;}
  function ok(tb){if(!tb||tb.hasAttribute('data-noreorder'))return false;var h=hrow(tb);if(!h||h.cells.length<2)return false;
    for(var i=0;i<h.cells.length;i++)if((h.cells[i].colSpan||1)>1)return false;return true;}
  function labs(tb){var h=hrow(tb);return [].map.call(h.cells,function(c){if(!c.dataset.ck)c.dataset.ck=lab(c);return c.dataset.ck;});}
  function sk(tb){return 'colord:'+location.pathname+':'+labs(tb).slice().sort().join('|');}
  function move(tb,from,to){if(from===to)return;var n=hrow(tb).cells.length;
    [].forEach.call(tb.rows,function(r){if(r.cells.length!==n)return;var c=r.cells[from],ref=r.cells[to];
      if(from<to)r.insertBefore(c,ref.nextSibling);else r.insertBefore(c,ref);});}
  function save(tb){try{localStorage.setItem(sk(tb),JSON.stringify(labs(tb)))}catch(e){}}
  function apply(tb){if(tb.__crApplied===tb.rows.length+':'+labs(tb).join('|'))return;var o;try{o=JSON.parse(localStorage.getItem(sk(tb))||'null')}catch(e){}
    if(o){o.forEach(function(l,i){var cur=labs(tb).indexOf(l);if(cur>=0&&cur!==i&&i<labs(tb).length)move(tb,cur,i);});}
    tb.__crApplied=tb.rows.length+':'+labs(tb).join('|');}
  function prep(){document.querySelectorAll('table').forEach(function(tb){if(!ok(tb))return;
    [].forEach.call(hrow(tb).cells,function(th){if(!th.draggable){th.draggable=true;th.title=th.title||'Click to sort · drag to move column';}});apply(tb);});}
  var src=null,pend=0;
  document.addEventListener('dragstart',function(e){var th=e.target.closest&&e.target.closest('th[draggable=true]');if(!th)return;
    if(e.target.closest('.rz')){e.preventDefault();return;}src=th;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',th.dataset.ck||'')}catch(x){}},true);
  document.addEventListener('dragover',function(e){if(!src)return;var th=e.target.closest&&e.target.closest('th');
    if(th&&th.parentElement===src.parentElement){e.preventDefault();document.querySelectorAll('th.cr-over').forEach(function(x){x.classList.remove('cr-over')});if(th!==src)th.classList.add('cr-over');}});
  document.addEventListener('drop',function(e){if(!src)return;var th=e.target.closest&&e.target.closest('th');
    if(th&&th.parentElement===src.parentElement&&th!==src){e.preventDefault();var tb=th.closest('table'),cs=[].slice.call(th.parentElement.cells);
      move(tb,cs.indexOf(src),cs.indexOf(th));save(tb);tb.__crApplied=tb.rows.length+':'+labs(tb).join('|');}});
  document.addEventListener('dragend',function(){src=null;document.querySelectorAll('th.cr-over').forEach(function(x){x.classList.remove('cr-over')});});
  function sched(){if(pend)return;pend=1;setTimeout(function(){pend=0;prep();},50);}
  new MutationObserver(function(){if(!src)sched();}).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',prep);else prep();
})();

</script><!--SORTABLE-END-->
<!--BOXDRAG-START--><script>
/* Shared drag-to-swap boxes (Grok Bot trackers).
   Every dashboard box (stat card, panel, section with a border/background/shadow that sits next to
